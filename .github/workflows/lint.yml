name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  copy-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: No em/en dashes in user-facing copy
        run: npm run lint:dashes
      - name: Build
        run: npm run build
